App\Entity\Location:
    properties:
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: ['create', 'edit']
                  invalidMessage: 'This value should be between -90 and 90.'
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: ['create', 'edit']
                  invalidMessage: 'This value should be between -180 and 180.'
App\Entity\Measurement:
    properties:
        celsius:
            - Range:
                  min: -50
                  max: 50
                  groups: ['create', 'edit']
                  invalidMessage: 'This value should be between -50 and 50.'
